name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 上游 devDependency 里有 canvas@2（原生模块）。CI 上不装它：
      # 3 个 canvas 相关测试文件会失败（不计入通过），其余全部执行。
      # 用 npm ci 而不是 npm install：lockfile 必须与实际依赖一致，
      # 否则新依赖装不上也不会报错（本项目在 @zxing/library 上踩过这个坑）。
      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Decoders present
        run: node -e "const d=require('./lib/scanproof/decoder');const a=d.available();console.log(a);if(!a.jsqr||!a.zxing)process.exit(1)"

      - name: Lint (standard)
        run: npx standard lib/scanproof bin/qr-scanproof scripts test/scanproof test/run-tests.js

      - name: ScanProof tests
        run: npm run test:scanproof

      - name: Upstream regression (3 canvas-related failures expected)
        run: npm run test:upstream
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Measure (facts and timings)
        run: npm run measure

      - name: CLI exit-code contract
        shell: bash
        run: |
          set +e
          node bin/qr-scanproof "https://example.com" > /dev/null 2>&1; echo "pass-case=$?"
          node bin/qr-scanproof "https://example.com" --margin 0 > /dev/null 2>&1; echo "fail-case=$?"
          node bin/qr-scanproof "https://example.com" --width 100 > /dev/null 2>&1; echo "warn-case=$?"
          node bin/qr-scanproof "https://example.com" --no-decode > /dev/null 2>&1; echo "unknown-case=$?"

  pages:
    name: deploy demo to Pages
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-demo.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deploy
        uses: actions/deploy-pages@v4